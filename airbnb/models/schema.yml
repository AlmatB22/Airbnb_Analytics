models: 
  - name: dim_airbnb__listings
    description: Cleansed table which contains Airbnb listings.
    data_tests:
      - min_row_count:
          arguments:
            min_rows: 1000
          config:
            severity: 'warn'
    columns:
      - name: listing_id
        description: Primary key for the listings.
        data_tests: 
          - unique
          - not_null
    
      - name: host_id
        description: The host's id. References host table.
        data_tests:
          - not_null
          - relationships: 
              arguments:
                to: ref('dim_airbnb__hosts')
                field: host_id
    
      - name: room_type
        description: Type of the appartement / room.
        data_tests:
          - accepted_values:
              arguments:    
                values: ['Private room', 'Shared room', 'Hotel room', 'Entire home/apt']
      
      - name: minimum_nights
        description: '{{ doc("dim_airbnb__listings__minimum_nights")}}'
        data_tests:
          - positive_values

  - name: dim_airbnb__hosts
    config: 
      contract:
        enforced: true
    columns: 
      - name: host_id
        data_type: integer
      - name: host_name
        data_type: string
      - name: is_superhost
        data_type: string
      - name: created_at
        data_type: timestamp
      - name: updated_at
        data_type: timestamp


        
