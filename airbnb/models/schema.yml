models: 
  - name: dim_airbnb__listings
    columns:
      - name: listing_id
        data_tests: 
          - unique
          - not_null
    
      - name: host_id
        data_tests:
          - not_null
          - relationships: 
              arguments:
                to: ref('dim_airbnb__hosts')
                field: host_id
    
      - name: room_type
        data_tests:
          - accepted_values:
              arguments:    
                values: ['Private room', 'Shared room', 'Hotel room', 'Entire home/apt']

  - name: dim_airbnb__hosts
    config: 
      contract:
        enforced: true
    columns: 
      - name: host_id
        data_type: integer
      - name: host_name
        data_type: string
      - name: is_superhost
        data_type: string
      - name: created_at
        data_type: timestamp
      - name: updated_at
        data_type: timestamp


        
